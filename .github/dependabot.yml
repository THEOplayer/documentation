version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - update-types:
          - 'version-update:semver-major'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-type: 'production'
      # Keep Docusaurus packages in sync, even for patch updates
      - dependency-name: '@docusaurus*'
      # Skip patch updates for development dependencies
      - dependency-type: 'development'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      docusaurus:
        patterns:
          - '@docusaurus*'
          - 'docusaurus*'
      production-dependencies:
        dependency-type: 'production'
        exclude-patterns:
          - '@docusaurus*'
          - 'docusaurus*'
      development-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - '@docusaurus*'
          - 'docusaurus*'
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    groups:
      submodules:
        patterns:
          - '*'
    open-pull-requests-limit: 1
