name: Undeploy a pull request preview

on:
  workflow_call:
    inputs:
      environment_name:
        type: string
        required: true
      s3_prefix:
        description: AWS S3 prefix where the build is located.
        required: true
        type: string
      cf_invalidate_path:
        description: Path to invalidate on CloudFront after deployment.
        required: true
        type: string

concurrency: deploy-${{ github.ref }}

jobs:
  undeploy-from-cloudfront:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
      deployment: false
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - name: Create app token
        uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ inputs.environment_name == 'preview' }}
        with:
          client-id: ${{ vars.THEOPLAYER_BOT_APP_ID }}
          private-key: ${{ secrets.THEOPLAYER_BOT_PRIVATE_KEY }}

      - name: Configure AWS credentials ☁️
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE }}

      - name: 'Delete ${{ inputs.s3_prefix }} from S3 💾'
        run: |
          echo "Delete the files from S3 bucket: ${S3_BUCKET}/${S3_PREFIX}"
          aws s3 rm s3://${S3_BUCKET}/${S3_PREFIX} \
            --recursive \
            --only-show-errors
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
          S3_PREFIX: ${{ inputs.s3_prefix }}

      - name: Invalidate Amazon CloudFront 🧹
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${CF_DISTRIBUTION_ID} \
            --paths "${PATH_TO_INVALIDATE}"
        env:
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
          PATH_TO_INVALIDATE: ${{ inputs.cf_invalidate_path }}

      - name: Get undeployment timestamp 🕰️
        id: timestamp
        if: ${{ inputs.environment_name == 'preview' }}
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M %Z')" >> "$GITHUB_OUTPUT"

      - name: Update comment on Pull Request 🕸️
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ inputs.environment_name == 'preview' }}
        with:
          header: pr-preview
          only_update: true
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          message: |
            Documentation preview
            :---:
            | <h6>Preview removed at ${{ steps.timestamp.outputs.time }} because the pull request was closed.</h6>

      - name: Hide comment on Pull Request 🙈
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ inputs.environment_name == 'preview' }}
        with:
          header: pr-preview
          hide: true
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
