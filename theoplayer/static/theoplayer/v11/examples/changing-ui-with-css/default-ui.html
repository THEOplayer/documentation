<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Changing the Default UI with CSS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.theoplayer.com/dash/theoplayer/ui.css" />
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <script src="../utils.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      .theoplayer-skin {
        width: 100%;
        --primary-color: #ffc50f;
        --primary-background-text: #000000;
        --primary-background: #ffc50f;
        --secondary-color: #ffffff;
        --secondary-background-text: #000000;
        --secondary-background: #ffffff;
        --tertiary-color: #000000;
        --tertiary-background-text: #ffffff;
        --tertiary-background: #000000;
      }

      .theoplayer-skin .theo-primary-color,
      .theoplayer-skin .vjs-selected {
        color: var(--primary-color) !important;
      }

      .theoplayer-skin .theo-primary-background {
        color: var(--primary-background-text) !important;
        background-color: var(--primary-background) !important;
      }

      .theoplayer-skin .theo-secondary-color {
        color: var(--secondary-color) !important;
      }

      .theoplayer-skin .theo-secondary-background {
        color: var(--secondary-background-text) !important;
        background-color: var(--secondary-background) !important;
      }

      .theoplayer-skin .theo-tertiary-color {
        color: var(--tertiary-color) !important;
      }

      .theoplayer-skin .theo-tertiary-background {
        color: var(--tertiary-background-text) !important;
        background-color: var(--tertiary-background) !important;
      }
    </style>
  </head>
  <body>
    <div id="player" class="video-js theoplayer-skin vjs-16-9"></div>
    <script>
      var player = new THEOplayer.Player(document.querySelector('#player'), {
        libraryLocation: 'https://cdn.theoplayer.com/dash/theoplayer/',
        licenseUrl: '../../../../theoplayer-license.txt',
      });
      player.source = {
        sources: [
          {
            src: 'https://cdn.theoplayer.com/video/big_buck_bunny/big_buck_bunny_metadata.m3u8',
            type: 'application/x-mpegurl',
          },
        ],
        poster: 'https://cdn.theoplayer.com/video/big_buck_bunny/poster.jpg',
        metadata: { title: 'Big Buck Bunny' },
      };

      var colorKeys = [
        'primary-color',
        'primary-background-text',
        'primary-background',
        'secondary-color',
        'secondary-background-text',
        'secondary-background',
        'tertiary-color',
        'tertiary-background-text',
        'tertiary-background',
      ];

      onParentMessage('ui-colors', (message) => {
        var colors = message.colors;
        if (typeof colors !== 'object' || colors == null) return;
        var skin = document.querySelector('.theoplayer-skin');
        colorKeys.forEach(function (key) {
          var value = colors[key];
          if (typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value)) {
            skin.style.setProperty('--' + key, value);
          }
        });
      });
    </script>
  </body>
</html>
