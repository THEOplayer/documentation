<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Adaptive bitrate (ABR)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      theoplayer-default-ui:not(:defined) {
        display: inline-block;
        box-sizing: border-box;
      }

      theoplayer-default-ui {
        width: 100%;
        aspect-ratio: 16 / 9;
        font-family: 'Noto Sans', sans-serif;
        background: #000;
      }
    </style>
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <script nomodule src="https://unpkg.com/@theoplayer/web-ui@2/polyfills"></script>
    <script async src="https://unpkg.com/@theoplayer/web-ui@2"></script>
  </head>
  <body>
    <!--
      libraryLocation: For demonstration purposes, we use the theoplayer.com CDN.
      For production use, we recommend hosting THEOplayer yourself
      and changing this (as well as the <script> tags above)
      to point to THEOplayer's location on your own website.

      licenseUrl: Change this to point to your THEOplayer license file.
      Alternatively, replace it with a "license" property whose value is your THEOplayer license itself.
    -->
    <theoplayer-default-ui
      configuration='{"libraryLocation":"https://cdn.theoplayer.com/dash/theoplayer/","licenseUrl":"../../../../theoplayer-license.txt","abr":{"strategy":"bandwidth"},"mutedAutoplay":"all"}'
      source='{"sources":{"src":"https://cdn.theoplayer.com/video/big_buck_bunny/big_buck_bunny_metadata.m3u8","type":"application/x-mpegurl"},"poster":"https://cdn.theoplayer.com/video/big_buck_bunny/poster.jpg","metadata":{"title":"Big Buck Bunny"}}'
    ></theoplayer-default-ui>
    <script src="../utils.js"></script>
    <script>
      onPlayerReady((player) => {
        const source = player.source;
        let initialQuality;

        function describeQuality(quality) {
          return quality && { id: quality.id, width: quality.width, height: quality.height, bandwidth: quality.bandwidth };
        }

        function reportState() {
          const track = Array.from(player.videoTracks).find((track) => track.enabled);
          sendToParent('abr', {
            strategy: player.abr.strategy,
            qualities: track ? Array.from(track.qualities).map(describeQuality) : [],
            initialQuality: describeQuality(initialQuality),
            activeQuality: describeQuality(track && track.activeQuality),
            bandwidthEstimate: player.metrics.currentBandwidthEstimate,
          });
        }

        player.videoTracks.addEventListener('addtrack', (event) => {
          const track = event.track;
          track.addEventListener('activequalitychanged', (event) => {
            // The first quality chosen after loading a source is picked by the ABR strategy.
            if (!initialQuality) {
              initialQuality = event.quality;
            }
            reportState();
          });
          reportState();
        });
        player.addEventListener(['progress', 'emptied'], reportState);

        // Change the ABR strategy, then reload the source to see which initial quality it picks.
        onParentMessage('abr-strategy', ({ strategy }) => {
          player.abr.strategy = strategy;
          initialQuality = undefined;
          player.autoplay = true;
          player.source = source;
          reportState();
        });

        reportState();
      });
    </script>
  </body>
</html>
