<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Up Next: Big Buck Bunny (Default UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.theoplayer.com/dash/theoplayer/ui.css" />
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      .player-container {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
      }

      .player-container .video-js {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- The page that Up Next opens from the Default UI example. It plays the next video. -->
    <div class="player-container">
      <div id="player" class="video-js theoplayer-skin"></div>
    </div>
    <script>
      // libraryLocation: For demonstration purposes, we use the THEOplayer CDN.
      // For production use, host the library yourself and update this URL and the script above.
      // licenseUrl: Point this to your license file, or replace it with a license property.
      var player = new THEOplayer.Player(document.querySelector('#player'), {
        libraryLocation: 'https://cdn.theoplayer.com/dash/theoplayer/',
        licenseUrl: '../../../../theoplayer-license.txt',
        mutedAutoplay: 'all',
      });
      window.player = player;

      player.autoplay = true;
      player.source = {
        sources: [
          {
            src: 'https://cdn.theoplayer.com/video/dash/big_buck_bunny/BigBuckBunny_10s_simple_2014_05_09.mpd',
            type: 'application/dash+xml',
          },
        ],
        poster: 'https://cdn.theoplayer.com/video/posters/big_buck_bunny.jpg',
        metadata: { title: 'Big Buck Bunny' },
      };
    </script>
  </body>
</html>
