<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Video fit (Default UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.theoplayer.com/dash/theoplayer/ui.css" />
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      /* Make the player wider than the 16:9 video, so the effect of each fit is visible. */
      .player-container {
        position: relative;
        width: 100%;
        aspect-ratio: 21 / 9;
      }

      .player-container .video-js {
        width: 100%;
        height: 100%;
      }

      /* How the video fits inside the player: contain (default), cover or fill. */
      .theoplayer-skin video {
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="player-container">
      <div id="player" class="video-js theoplayer-skin"></div>
    </div>
    <script src="../utils.js"></script>
    <script>
      var player = new THEOplayer.Player(document.querySelector('#player'), {
        libraryLocation: 'https://cdn.theoplayer.com/dash/theoplayer/',
        licenseUrl: '../../../../theoplayer-license.txt',
        mutedAutoplay: 'all',
      });
      player.source = {
        sources: [{ src: 'https://cdn.theoplayer.com/video/big_buck_bunny/big_buck_bunny.m3u8', type: 'application/x-mpegurl' }],
        poster: 'https://cdn.theoplayer.com/video/big_buck_bunny/poster.jpg',
        metadata: { title: 'Big Buck Bunny' },
      };

      onParentMessage('video-fit', function (message) {
        document.querySelectorAll('.theoplayer-skin video').forEach(function (video) {
          video.style.objectFit = message.fit;
        });
      });
    </script>
  </body>
</html>
