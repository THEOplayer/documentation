<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Video fit (Default UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.theoplayer.com/dash/theoplayer/ui.css" />
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      .fit-options {
        display: flex;
        gap: 0.5rem;
        padding: 0.5rem 0;
      }

      .fit-options button {
        padding: 0.25rem 0.75rem;
        border: 1px solid #888;
        border-radius: 4px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }

      .fit-options button[aria-pressed='true'] {
        border-color: #000;
        background: #000;
        color: #fff;
      }

      /* Make the player wider than the 16:9 video, so the effect of each fit is visible. */
      .player-container {
        position: relative;
        width: 100%;
        aspect-ratio: 21 / 9;
      }

      .player-container .video-js {
        width: 100%;
        height: 100%;
      }

      /* How the video fits inside the player: contain (default), cover or fill. */
      .theoplayer-skin video {
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="fit-options" role="group" aria-label="Video fit">
      <button type="button" data-fit="contain" aria-pressed="true">contain</button>
      <button type="button" data-fit="cover" aria-pressed="false">cover</button>
      <button type="button" data-fit="fill" aria-pressed="false">fill</button>
    </div>
    <div class="player-container">
      <div id="player" class="video-js theoplayer-skin"></div>
    </div>
    <script>
      var player = new THEOplayer.Player(document.querySelector('#player'), {
        libraryLocation: 'https://cdn.theoplayer.com/dash/theoplayer/',
        licenseUrl: '../../../../theoplayer-license.txt',
        mutedAutoplay: 'all',
      });
      player.source = {
        sources: [{ src: 'https://cdn.theoplayer.com/video/big_buck_bunny/big_buck_bunny.m3u8', type: 'application/x-mpegurl' }],
        poster: 'https://cdn.theoplayer.com/video/big_buck_bunny/poster.jpg',
        metadata: { title: 'Big Buck Bunny' },
      };

      var buttons = document.querySelectorAll('.fit-options button');
      buttons.forEach(function (button) {
        button.addEventListener('click', function () {
          document.querySelectorAll('.theoplayer-skin video').forEach(function (video) {
            video.style.objectFit = button.dataset.fit;
          });
          buttons.forEach(function (other) {
            other.setAttribute('aria-pressed', String(other === button));
          });
        });
      });
    </script>
  </body>
</html>
