<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Google DAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      theoplayer-default-ui:not(:defined) {
        display: inline-block;
        box-sizing: border-box;
      }

      theoplayer-default-ui {
        width: 100%;
        aspect-ratio: 16 / 9;
        font-family: 'Noto Sans', sans-serif;
        background: #000;
      }
    </style>
    <script src="https://imasdk.googleapis.com/js/sdkloader/ima3_dai.js"></script>
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <script nomodule src="https://unpkg.com/@theoplayer/web-ui@2/polyfills"></script>
    <script async src="https://unpkg.com/@theoplayer/web-ui@2"></script>
  </head>
  <body>
    <!--
      libraryLocation: For demonstration purposes, we use the THEOplayer CDN.
      For production use, host the library yourself and update this URL and the script above.

      licenseUrl: Point this to your license file, or replace it with a license property.
    -->
    <theoplayer-default-ui
      configuration='{"libraryLocation":"https://cdn.theoplayer.com/dash/theoplayer/","licenseUrl":"../../../../theoplayer-license.txt"}'
    ></theoplayer-default-ui>
    <script src="../utils.js"></script>
    <script>
      const adEventNames = [
        'addadbreak',
        'removeadbreak',
        'adbreakbegin',
        'adbegin',
        'adfirstquartile',
        'admidpoint',
        'adthirdquartile',
        'adend',
        'adbreakend',
        'adimpression',
        'adskip',
        'aderror',
        'adloaded',
        'updateadbreak',
        'adbreakchange',
        'addad',
        'updatead',
        'adbuffering',
        'adclicked',
      ];

      const defaultConfiguration = {
        format: 'hls',
        availability: 'vod',
        contentSourceID: '2548831',
        videoID: 'tears-of-steel',
        assetKey: '',
        apiKey: '',
      };

      onPlayerReady((player) => {
        let events = [];
        let adBreaks = [];
        let initialSource = true;

        function scheduledBreaks() {
          return adBreaks.map(({ key, ...adBreak }) => adBreak);
        }

        function report() {
          const ads = player.ads;
          const scheduledAdBreaks = ads && ads.scheduledAdBreaks;
          if (initialSource && Array.isArray(scheduledAdBreaks)) {
            adBreaks = scheduledAdBreaks.map((breakInfo) => ({
              key: String(breakInfo.id ?? breakInfo.timeOffset ?? 'unknown'),
              timeOffset: typeof breakInfo.timeOffset === 'number' ? breakInfo.timeOffset : null,
              maxDuration: typeof breakInfo.maxDuration === 'number' ? breakInfo.maxDuration : null,
              adCount:
                typeof breakInfo.adCount === 'number'
                  ? breakInfo.adCount
                  : breakInfo.ads && typeof breakInfo.ads.length === 'number'
                    ? breakInfo.ads.length
                    : 0,
            }));
          }
          const streamTime = Number.isFinite(player.currentTime) ? player.currentTime : null;
          let contentTime = null;
          if (ads && ads.dai && streamTime !== null) {
            const converted = ads.dai.contentTimeForStreamTime(streamTime);
            contentTime = Number.isFinite(converted) ? converted : null;
          }
          sendToParent('dai-state', {
            adBreaks: scheduledBreaks(),
            events: events.slice(),
            streamTime,
            contentTime,
          });
        }

        function logEvent(name, event) {
          const details = [];
          if (event && event.adBreak) {
            const breakInfo = event.adBreak;
            const key = String(breakInfo.id ?? breakInfo.timeOffset ?? 'unknown');
            const existingIndex = adBreaks.findIndex((adBreak) => adBreak.key === key);
            if (name === 'removeadbreak') {
              if (existingIndex >= 0) adBreaks.splice(existingIndex, 1);
            } else if (name === 'addadbreak' || name === 'updateadbreak') {
              const nextBreak = {
                key,
                timeOffset: typeof breakInfo.timeOffset === 'number' ? breakInfo.timeOffset : null,
                maxDuration: typeof breakInfo.maxDuration === 'number' ? breakInfo.maxDuration : null,
                adCount:
                  typeof breakInfo.adCount === 'number'
                    ? breakInfo.adCount
                    : breakInfo.ads && typeof breakInfo.ads.length === 'number'
                      ? breakInfo.ads.length
                      : 0,
              };
              if (existingIndex >= 0) adBreaks[existingIndex] = nextBreak;
              else adBreaks.push(nextBreak);
            }
          }
          if (event && event.ad) {
            if (event.ad.id) details.push(`Ad ${event.ad.id}`);
            if (typeof event.ad.duration === 'number') details.push(`duration ${event.ad.duration.toFixed(1)} s`);
          }
          if (event && event.adBreak && typeof event.adBreak.timeOffset === 'number') {
            details.push(`break at ${event.adBreak.timeOffset.toFixed(1)} s`);
          }
          const errorMessage =
            (event && event.error && event.error.message) || (event && typeof event.error === 'string' && event.error) || (event && event.message);
          if (errorMessage) details.push(String(errorMessage));
          events = [
            {
              wallClock: new Date().toLocaleTimeString(),
              playerTime: Number.isFinite(player.currentTime) ? player.currentTime : null,
              event: name,
              details: details.join(' · '),
            },
            ...events,
          ].slice(0, 100);
          report();
        }

        function sourceFor(configuration) {
          const ssai = {
            integration: 'google-dai',
            availabilityType: configuration.availability,
            apiKey: configuration.apiKey || null,
          };
          if (configuration.availability === 'vod') {
            ssai.contentSourceID = configuration.contentSourceID;
            ssai.videoID = configuration.videoID;
          } else {
            ssai.assetKey = configuration.assetKey;
          }
          return {
            sources: {
              type: configuration.format === 'dash' ? 'application/dash+xml' : 'application/x-mpegurl',
              ssai,
            },
          };
        }

        function loadConfiguration(configuration) {
          events = [];
          adBreaks = [];
          player.source = sourceFor(configuration);
          player.muted = true;
          const playResult = player.play();
          if (playResult && typeof playResult.catch === 'function') playResult.catch(() => {});
          report();
        }

        if (player.ads && typeof player.ads.addEventListener === 'function') {
          player.ads.addEventListener(adEventNames, (event) => logEvent(event.type, event));
        }
        player.addEventListener('sourcechange', (event) => {
          events = [];
          adBreaks = [];
          logEvent('sourcechange', event);
        });
        player.addEventListener('error', (event) => {
          const error = player.errorObject;
          logEvent('error', { ...event, message: (error && error.message) || (event && event.message) || 'Player error' });
        });
        player.addEventListener('timeupdate', report);

        onParentMessage('load-dai', (message) => {
          if (message.config && typeof message.config === 'object') {
            initialSource = false;
            loadConfiguration(message.config);
          }
        });
        onParentMessage('clear-dai-log', () => {
          events = [];
          report();
        });

        loadConfiguration(defaultConfiguration);
      });
    </script>
  </body>
</html>
