<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ID3 metadata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      theoplayer-default-ui:not(:defined) {
        display: inline-block;
        box-sizing: border-box;
      }

      theoplayer-default-ui {
        width: 100%;
        aspect-ratio: 16 / 9;
        font-family: 'Noto Sans', sans-serif;
        background: #000;
      }
    </style>
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <script nomodule src="https://unpkg.com/@theoplayer/web-ui@2/polyfills"></script>
    <script async src="https://unpkg.com/@theoplayer/web-ui@2"></script>
  </head>
  <body>
    <!--
      libraryLocation: For demonstration purposes, we use the theoplayer.com CDN.
      For production use, we recommend hosting THEOplayer yourself
      and changing this (as well as the <script> tags above)
      to point to THEOplayer's location on your own website.

      licenseUrl: Change this to point to your THEOplayer license file.
      Alternatively, replace it with a "license" property whose value is your THEOplayer license itself.
    -->
    <theoplayer-default-ui
      configuration='{"libraryLocation":"https://cdn.theoplayer.com/dash/theoplayer/","licenseUrl":"../../../../theoplayer-license.txt"}'
      source='{"sources":{"src":"https://cdn.theoplayer.com/video/indexcom/index.m3u8","type":"application/x-mpegurl"},"poster":"https://cdn2.hubspot.net/hubfs/2163521/Demo_zone/id3_background.svg","metadata":{"title":"Radio with ID3 metadata"}}'
    ></theoplayer-default-ui>
    <script src="../utils.js"></script>
    <script>
      // Convert an ID3 frame into a simple { id, description, value } object.
      function parseFrame(frame) {
        switch (frame.id) {
          case 'TXXX': // User defined text
            return { id: frame.id, description: frame.description, value: frame.text };
          case 'WXXX': // User defined URL
            return { id: frame.id, description: frame.description, value: frame.url };
          case 'COMM': // Comments
            return { id: frame.id, description: frame.description, value: frame.text };
          case 'PRIV': // Private data
            return { id: frame.id, description: frame.ownerIdentifier, value: '(private data)' };
          default:
            if ('text' in frame) {
              return { id: frame.id, value: frame.text };
            }
            if ('url' in frame) {
              return { id: frame.id, value: frame.url };
            }
            return { id: frame.id, value: '(binary data)' };
        }
      }

      onPlayerReady((player) => {
        player.textTracks.addEventListener('addtrack', (event) => {
          const track = event.track;
          if (track.type !== 'id3') return;
          // Metadata tracks must be enabled to receive cues.
          track.mode = 'hidden';
          track.addEventListener('entercue', (event) => {
            const cue = event.cue;
            const frame = parseFrame(cue.content);
            console.log('ID3 frame', cue.content);
            sendToParent('id3', { frame: { ...frame, startTime: cue.startTime } });
          });
        });
      });
    </script>
  </body>
</html>
