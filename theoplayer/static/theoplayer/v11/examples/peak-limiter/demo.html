<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Peak limiter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #eee;
        font-family: 'Noto Sans', sans-serif;
      }

      theoplayer-default-ui:not(:defined) {
        display: inline-block;
        box-sizing: border-box;
      }

      theoplayer-default-ui {
        width: 100%;
        aspect-ratio: 16 / 9;
        font-family: 'Noto Sans', sans-serif;
        background: #000;
      }

      .limiter-panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px 20px;
        padding: 12px 16px;
      }

      .limiter-panel label {
        display: grid;
        gap: 4px;
        font-size: 14px;
      }

      .limiter-panel output {
        font-variant-numeric: tabular-nums;
        color: #aaa;
      }

      .limiter-panel input[type='range'] {
        width: 100%;
        min-height: 28px;
        touch-action: none;
        accent-color: #ffc50f;
      }

      .limiter-panel .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .limiter-panel .toggle input {
        width: 20px;
        height: 20px;
        accent-color: #ffc50f;
      }

      .meter {
        display: grid;
        gap: 4px;
        padding: 0 16px 12px;
        font-size: 14px;
      }

      .meter-bar {
        position: relative;
        height: 12px;
        background: #333;
        border-radius: 2px;
        overflow: hidden;
      }

      .meter-level {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: #4caf50;
      }

      .meter-level.clipping {
        background: #f44336;
      }

      .meter-peak {
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <script nomodule src="https://unpkg.com/@theoplayer/web-ui@2/polyfills"></script>
    <script async src="https://unpkg.com/@theoplayer/web-ui@2"></script>
  </head>
  <body>
    <!--
      libraryLocation: For demonstration purposes, we use the THEOplayer CDN.
      For production use, host the library yourself and update this URL and the script above.

      licenseUrl: Point this to your license file, or replace it with a license property.
    -->
    <theoplayer-default-ui
      configuration='{"libraryLocation":"https://cdn.theoplayer.com/dash/theoplayer/","licenseUrl":"../../../../theoplayer-license.txt"}'
      source='{"sources":{"src":"https://cdn.theoplayer.com/video/tears_of_steel/index.m3u8","type":"application/x-mpegurl"},"poster":"https://cdn.theoplayer.com/video/posters/tears_of_steel.jpg","metadata":{"title":"Tears of Steel"}}'
    ></theoplayer-default-ui>
    <div class="limiter-panel">
      <label>
        <span>Boost <output data-for="boost">+18 dB</output></span>
        <input type="range" name="boost" min="0" max="24" step="1" value="18" />
      </label>
      <label>
        <span>Ceiling <output data-for="ceiling">-1 dB</output></span>
        <input type="range" name="ceiling" min="-24" max="0" step="1" value="-1" />
      </label>
      <label class="toggle"><input type="checkbox" name="limiter" checked /> Limiter on</label>
    </div>
    <div class="meter">
      <span>Output peak: <span class="meter-peak">-∞ dB</span></span>
      <div class="meter-bar"><div class="meter-level"></div></div>
    </div>
    <script src="../utils.js"></script>
    <script type="module">
      // For demonstration purposes, we load the limiter from a CDN.
      // For production use, install @synthlet/lookahead-limiter from npm and bundle it with your app.
      import { registerLookaheadLimiterWorklet, LookaheadLimiter } from 'https://unpkg.com/@synthlet/lookahead-limiter@0.2.0/dist/index.mjs';

      onPlayerReady(async (player) => {
        const context = new AudioContext();
        await registerLookaheadLimiterWorklet(context);

        const panel = document.querySelector('.limiter-panel');
        const boostInput = panel.querySelector('input[name="boost"]');
        const ceilingInput = panel.querySelector('input[name="ceiling"]');
        const limiterInput = panel.querySelector('input[name="limiter"]');

        // With the limiter on:  source -> limiter (boost + ceiling) -> meter -> speakers
        // With the limiter off: source -> boost -> meter -> speakers
        const source = player.audio.createAudioSourceNode(context);
        const limiter = LookaheadLimiter(context, {
          gain: Number(boostInput.value),
          threshold: Number(ceilingInput.value),
        });
        const boost = new GainNode(context, { gain: decibelsToGain(Number(boostInput.value)) });
        const meter = new AnalyserNode(context, { fftSize: 2048 });

        limiter.connect(meter);
        boost.connect(meter);
        meter.connect(context.destination);

        function connectSource() {
          source.disconnect();
          source.connect(limiterInput.checked ? limiter : boost);
        }
        connectSource();

        // Browsers start an AudioContext suspended until the user interacts with the page.
        // While it's suspended, the player's audio is silent, so resume it on playback and on any interaction.
        function resumeContext() {
          if (context.state === 'suspended') context.resume();
        }
        player.addEventListener('play', resumeContext);
        document.addEventListener('pointerdown', resumeContext);
        document.addEventListener('keydown', resumeContext);

        boostInput.addEventListener('input', () => {
          const decibels = Number(boostInput.value);
          limiter.gain.setTargetAtTime(decibels, context.currentTime, 0.02);
          boost.gain.setTargetAtTime(decibelsToGain(decibels), context.currentTime, 0.02);
          panel.querySelector('output[data-for="boost"]').textContent = `+${decibels} dB`;
        });

        ceilingInput.addEventListener('input', () => {
          const decibels = Number(ceilingInput.value);
          limiter.threshold.setTargetAtTime(decibels, context.currentTime, 0.02);
          panel.querySelector('output[data-for="ceiling"]').textContent = `${decibels} dB`;
        });

        limiterInput.addEventListener('change', () => {
          connectSource();
          ceilingInput.disabled = !limiterInput.checked;
        });

        // Show the highest sample of the output. Above 0 dB, the audio clips.
        const peakLabel = document.querySelector('.meter-peak');
        const level = document.querySelector('.meter-level');
        const samples = new Float32Array(meter.fftSize);
        let peakHold = 0;
        let peakHoldUntil = 0;

        function drawMeter(now) {
          requestAnimationFrame(drawMeter);
          meter.getFloatTimeDomainData(samples);
          const peak = samples.reduce((max, sample) => Math.max(max, Math.abs(sample)), 0);
          if (peak >= peakHold || now > peakHoldUntil) {
            peakHold = peak;
            peakHoldUntil = now + 1000;
          }
          const decibels = 20 * Math.log10(peakHold);
          peakLabel.textContent = Number.isFinite(decibels) ? `${decibels.toFixed(1)} dB` : '-∞ dB';
          level.style.width = `${Math.min(100, Math.max(0, (decibels + 48) / 54) * 100)}%`;
          level.classList.toggle('clipping', decibels > 0);
        }
        requestAnimationFrame(drawMeter);
      });

      function decibelsToGain(decibels) {
        return 10 ** (decibels / 20);
      }
    </script>
  </body>
</html>
