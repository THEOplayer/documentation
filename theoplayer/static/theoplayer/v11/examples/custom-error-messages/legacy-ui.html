<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Custom error messages (legacy UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.theoplayer.com/dash/theoplayer/ui.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
    </style>
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
  </head>
  <body>
    <div id="player" class="video-js theoplayer-skin vjs-16-9"></div>
    <script src="../utils.js"></script>
    <script>
      // Custom messages for specific error codes.
      function getCustomErrorMessage(error) {
        switch (error.code) {
          case THEOplayer.ErrorCode.MANIFEST_LOAD_ERROR:
            return 'This video is not available right now. Please try again later.';
          case THEOplayer.ErrorCode.SOURCE_NOT_SUPPORTED:
            return 'This video format is not supported by your browser.';
          case THEOplayer.ErrorCode.NETWORK_ERROR:
          case THEOplayer.ErrorCode.NETWORK_TIMEOUT:
            return 'Please check your internet connection and try again.';
          default:
            return `Something went wrong while playing this video (error ${error.code}).`;
        }
      }

      const sources = {
        // The manifest does not exist, so the player fails with a MANIFEST_LOAD_ERROR.
        notFound: {
          sources: { src: 'https://cdn.theoplayer.com/video/this-stream-does-not-exist/index.m3u8', type: 'application/x-mpegurl' },
        },
        // The source has a type which the player does not support, so the player fails with a SOURCE_NOT_SUPPORTED error.
        unsupported: {
          sources: { src: 'https://cdn.theoplayer.com/video/big_buck_bunny/big_buck_bunny.m3u8', type: 'video/x-unsupported' },
        },
        // A valid stream, which plays without errors.
        valid: {
          sources: { src: 'https://cdn.theoplayer.com/video/big_buck_bunny/big_buck_bunny.m3u8', type: 'application/x-mpegurl' },
          poster: 'https://cdn.theoplayer.com/video/big_buck_bunny/poster.jpg',
        },
      };

      /*
        libraryLocation: For demonstration purposes, we use the theoplayer.com CDN.
        For production use, we recommend hosting THEOplayer yourself
        and changing this (as well as the <script> and <link> tags above)
        to point to THEOplayer's location on your own website.

        licenseUrl: Change this to point to your THEOplayer license file.
        Alternatively, replace it with a "license" property whose value is your THEOplayer license itself.
      */
      const element = document.querySelector('#player');
      var player = new THEOplayer.Player(element, {
        libraryLocation: 'https://cdn.theoplayer.com/dash/theoplayer/',
        licenseUrl: '../../../../theoplayer-license.txt',
      });

      // Replace the message in the error display when an error occurs.
      player.addEventListener('error', (event) => {
        const message = getCustomErrorMessage(event.errorObject);
        // Wait for the UI to show its own error message first.
        setTimeout(() => {
          const content = element.querySelector('.vjs-error-display .vjs-modal-dialog-content');
          if (content) {
            content.textContent = message;
          }
        });
      });

      // Load the manifest right away, so errors are shown without having to press play.
      player.preload = 'auto';
      player.source = sources.notFound;

      onParentMessage('error-source', ({ name }) => {
        player.source = sources[name];
      });
    </script>
  </body>
</html>
