<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yospace SSAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: 'Noto Sans', sans-serif;
        font-size: 14px;
      }

      theoplayer-default-ui:not(:defined) {
        display: inline-block;
        box-sizing: border-box;
      }

      theoplayer-default-ui {
        width: 100%;
        aspect-ratio: 16 / 9;
        font-family: 'Noto Sans', sans-serif;
        background: #000;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
      }

      .controls button {
        padding: 6px 12px;
        border: 1px solid #888;
        border-radius: 4px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }

      .controls button[aria-pressed='true'] {
        background: #000;
        border-color: #000;
        color: #fff;
      }

      .status {
        margin: 0 0 8px;
      }

      .log {
        height: 160px;
        margin: 0;
        padding: 8px;
        overflow-y: auto;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f6f6f6;
        font-family: monospace;
        font-size: 13px;
        list-style: none;
      }
    </style>
    <!--
      The Yospace Ad Management SDK (3.10.0 or newer) defines the YospaceAdManagement global.
      Get the SDK from Yospace and host it yourself in production.
    -->
    <script src="https://cdn.theoplayer.com/demos/yospace/admanagement-sdk-3.11.3.min.js"></script>
    <!-- THEOplayer library and Open Video UI. For production use, host these yourself. -->
    <script src="https://cdn.theoplayer.com/dash/theoplayer/THEOplayer.js"></script>
    <script type="module" src="https://unpkg.com/@theoplayer/web-ui@2"></script>
    <script nomodule src="https://unpkg.com/@theoplayer/web-ui@2/polyfills"></script>
    <script nomodule src="https://unpkg.com/@theoplayer/web-ui@2"></script>
    <!-- The Yospace connector. For production use, install @theoplayer/yospace-connector-web from npm. -->
    <script src="https://unpkg.com/@theoplayer/yospace-connector-web@3.0.0/dist/yospace-connector.umd.js"></script>
  </head>
  <body>
    <!--
      libraryLocation: For demonstration purposes, we use the THEOplayer CDN.
      licenseUrl: Point this to your license file, or replace it with a license property.
    -->
    <theoplayer-default-ui
      configuration='{"libraryLocation":"https://cdn.theoplayer.com/dash/theoplayer/","licenseUrl":"../../../../theoplayer-license.txt","mutedAutoplay":"all"}'
    ></theoplayer-default-ui>

    <div class="controls" role="group" aria-label="Yospace stream">
      <button type="button" data-stream="hls" aria-pressed="false">HLS live</button>
      <button type="button" data-stream="hlsPause" aria-pressed="false">HLS live-pause</button>
      <button type="button" data-stream="dash" aria-pressed="false">DASH live-pause</button>
    </div>
    <p class="status" aria-live="polite">Current ad break: none</p>
    <ul class="log" aria-label="Ad event log"></ul>

    <script src="../utils.js"></script>
    <script>
      // Yospace validation streams. The ad breaks are stitched into these streams by the Yospace server.
      const streams = {
        dash: {
          src: 'https://csm-e-sdk-validation-eb.bln1.yospace.com/csm/extlive/yosdk02,dash-mp4-pre.mpd?yo.br=false&yo.av=5&yo.lpa=dur',
          streamType: 'livepause',
        },
        hls: {
          src: 'https://csm-e-sdk-validation-eb.bln1.yospace.com/csm/extlive/yosdk02,hls-ts-pre.m3u8?yo.av=5',
          streamType: 'live',
        },
        hlsPause: {
          src: 'https://csm-e-sdk-validation-eb.bln1.yospace.com/csm/extlive/yosdk02,hls-ts-pre.m3u8?yo.br=false&yo.av=5&yo.lpa=dur',
          streamType: 'livepause',
        },
      };

      const buttons = document.querySelectorAll('.controls button');
      const status = document.querySelector('.status');
      const log = document.querySelector('.log');

      function addLogLine(text) {
        const line = document.createElement('li');
        line.textContent = `${new Date().toLocaleTimeString()} ${text}`;
        log.prepend(line);
      }

      onPlayerReady((player) => {
        const yospace = new THEOplayerYospaceConnector.YospaceConnector(player);

        async function loadStream(name) {
          const stream = streams[name];
          for (const button of buttons) {
            button.setAttribute('aria-pressed', String(button.dataset.stream === name));
            button.disabled = true;
          }
          status.textContent = 'Current ad break: none';
          addLogLine(`Setting up a Yospace session (${stream.streamType})`);
          player.autoplay = true;
          try {
            // The connector creates a Yospace session and sets the stream it returns as the player source.
            await yospace.setupYospaceSession({
              sources: [
                {
                  src: stream.src,
                  ssai: {
                    integration: 'yospace',
                    streamType: stream.streamType,
                  },
                },
              ],
            });
            addLogLine('Yospace session ready');
          } catch (error) {
            addLogLine(`Yospace session failed: ${error.message ?? error}`);
          } finally {
            for (const button of buttons) {
              button.disabled = false;
            }
          }
        }

        // The connector reports the stitched ad breaks and ads through the player's ads API.
        player.ads.addEventListener(['addadbreak', 'removeadbreak'], (event) => {
          addLogLine(`${event.type}: ad break at ${event.adBreak.timeOffset} s`);
        });
        player.ads.addEventListener('adbreakbegin', (event) => {
          status.textContent = `Current ad break: ${event.adBreak.ads.length} ad(s), at ${event.adBreak.timeOffset} s`;
          addLogLine('adbreakbegin');
        });
        player.ads.addEventListener('adbreakend', () => {
          status.textContent = 'Current ad break: none';
          addLogLine('adbreakend');
        });
        player.ads.addEventListener(['adbegin', 'adend'], (event) => {
          addLogLine(`${event.type}: ad ${event.ad.id ?? ''} (${event.ad.duration ?? '?'} s)`);
        });
        player.addEventListener('error', (event) => {
          addLogLine(`error: ${event.errorObject?.message ?? 'unknown'}`);
        });

        for (const button of buttons) {
          button.addEventListener('click', () => loadStream(button.dataset.stream));
        }

        loadStream('hls');
      });
    </script>
  </body>
</html>
