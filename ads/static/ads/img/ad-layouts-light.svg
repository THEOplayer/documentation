<svg width="940" height="520" viewBox="0 0 940 520" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="OptiView Ads layouts: Single, Double Box, L-Shape Ad, L-Shape Content, and Overlay">
  <defs>
    <linearGradient id="lg-content" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lg-ad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="lg-companion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <filter id="lg-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <g id="lg-play">
      <circle r="17" fill="#FFFFFF" fill-opacity="0.22"/>
      <path d="M-5 -8 L9 0 L-5 8 z" fill="#FFFFFF" fill-opacity="0.9"/>
    </g>
  </defs>

  <!-- Row 1 -->
  <!-- Single -->
  <g transform="translate(20,30)">
    <rect width="260" height="146" rx="10" fill="url(#lg-ad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lg-shadow)"/>
    <text x="130" y="70" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="2">AD</text>
    <rect x="18" y="120" width="224" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="18" y="120" width="90" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.85"/>
    <text x="130" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Single</text>
    <text x="130" y="194" text-anchor="middle" font-size="11" fill="#64748B">full-screen ad</text>
  </g>

  <!-- Double Box -->
  <g transform="translate(340,30)">
    <rect width="260" height="146" rx="10" fill="url(#lg-companion)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lg-shadow)"/>
    <rect x="12" y="12" width="115" height="122" rx="6" fill="url(#lg-content)"/>
    <use href="#lg-play" x="69.5" y="73"/>
    <rect x="133" y="12" width="115" height="122" rx="6" fill="url(#lg-ad)"/>
    <text x="190.5" y="79" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="2">AD</text>
    <text x="130" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Double Box</text>
    <text x="130" y="194" text-anchor="middle" font-size="11" fill="#64748B">content and ad side by side</text>
  </g>

  <!-- L-Shape Ad -->
  <g transform="translate(660,30)">
    <rect width="260" height="146" rx="10" fill="url(#lg-companion)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lg-shadow)"/>
    <rect x="12" y="12" width="165" height="92" rx="6" fill="url(#lg-ad)"/>
    <text x="94.5" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="2">AD</text>
    <text x="218" y="64" text-anchor="middle" font-size="10" fill="#6D28D9">companion</text>
    <text x="130" y="126" text-anchor="middle" font-size="10" fill="#6D28D9">companion backdrop</text>
    <text x="130" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">L-Shape Ad</text>
    <text x="130" y="194" text-anchor="middle" font-size="11" fill="#64748B">ad window with companion backdrop</text>
  </g>

  <!-- Row 2 -->
  <!-- L-Shape Content -->
  <g transform="translate(180,270)">
    <rect width="260" height="146" rx="10" fill="url(#lg-ad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lg-shadow)"/>
    <rect x="12" y="12" width="165" height="92" rx="6" fill="url(#lg-content)"/>
    <use href="#lg-play" x="94.5" y="58"/>
    <text x="218" y="64" text-anchor="middle" font-size="10" fill="#FFFFFF" fill-opacity="0.85">ad</text>
    <text x="130" y="126" text-anchor="middle" font-size="10" fill="#FFFFFF" fill-opacity="0.85">ad backdrop</text>
    <text x="130" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">L-Shape Content</text>
    <text x="130" y="194" text-anchor="middle" font-size="11" fill="#64748B">content window with ad backdrop</text>
  </g>

  <!-- Overlay -->
  <g transform="translate(500,270)">
    <rect width="260" height="146" rx="10" fill="url(#lg-content)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#lg-shadow)"/>
    <use href="#lg-play" x="110" y="66"/>
    <rect x="152" y="88" width="94" height="44" rx="6" fill="url(#lg-ad)" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.5"/>
    <text x="199" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">AD</text>
    <text x="130" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Overlay</text>
    <text x="130" y="194" text-anchor="middle" font-size="11" fill="#64748B">ad on top of playing content</text>
  </g>

  <!-- Legend -->
  <g transform="translate(276,486)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="url(#lg-content)"/>
    <text x="24" y="12.5" font-size="12" fill="#334155">Content</text>
    <rect x="102" y="0" width="16" height="16" rx="4" fill="url(#lg-ad)"/>
    <text x="126" y="12.5" font-size="12" fill="#334155">Ad</text>
    <rect x="170" y="0" width="16" height="16" rx="4" fill="url(#lg-companion)" stroke="#CBD5E1"/>
    <text x="194" y="12.5" font-size="12" fill="#334155">Companion backdrop</text>
  </g>
</svg>
