<svg width="1160" height="720" viewBox="0 0 1160 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Double Box backdrop template: a 1920 by 1080 pixel backdrop with two 920 by 517.5 pixel video windows side by side, a 20 pixel border and a 40 pixel gap">
  <rect x="0" y="0" width="100%" height="100%" rx="8" fill="#f4f4fb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4800c4"/>
    </marker>
  </defs>
  <style>
    .dim { stroke: #4800c4; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    .leader { stroke: #4800c4; stroke-width: 1.5; fill: none; }
    .label { font-family: Arial, sans-serif; font-size: 20px; fill: #4800c4; }
    .win { font-family: Arial, sans-serif; font-weight: bold; fill: #FFFFFF; }
  </style>

  <!-- Backdrop -->
  <rect x="120" y="90" width="960" height="540" rx="6" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>

  <!-- Video windows -->
  <rect x="130" y="230.6" width="460" height="258.8" fill="#2D3748"/>
  <text x="360" y="356" text-anchor="middle" class="win" font-size="24">CONTENT</text>
  <text x="360" y="386" text-anchor="middle" class="win" font-size="17" font-weight="normal">920 × 517.5 px</text>

  <rect x="610" y="230.6" width="460" height="258.8" fill="#6d19ff"/>
  <text x="840" y="356" text-anchor="middle" class="win" font-size="24">AD</text>
  <text x="840" y="386" text-anchor="middle" class="win" font-size="17" font-weight="normal">920 × 517.5 px</text>

  <!-- Overall dimensions -->
  <line x1="120" y1="62" x2="1080" y2="62" class="dim"/>
  <text x="600" y="48" text-anchor="middle" class="label">1920 px</text>
  <line x1="92" y1="90" x2="92" y2="630" class="dim"/>
  <text x="78" y="365" text-anchor="middle" class="label" transform="rotate(-90 78 365)">1080 px</text>

  <!-- Top and bottom bands -->
  <line x1="885" y1="90" x2="885" y2="230.6" class="dim"/>
  <text x="898" y="168" class="label">281.25 px</text>
  <line x1="315" y1="489.4" x2="315" y2="630" class="dim"/>
  <text x="328" y="568" class="label">281.25 px</text>

  <!-- Border and gap leaders -->
  <path d="M 125 560 L 125 660 L 180 690" class="leader"/>
  <text x="190" y="696" class="label">20 px border</text>
  <path d="M 600 500 L 600 660 L 545 690" class="leader"/>
  <text x="535" y="696" text-anchor="end" class="label">40 px gap</text>
</svg>
