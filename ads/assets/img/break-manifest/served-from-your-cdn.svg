  <text x="610" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">/channel-5/index.m3u8</text>
  <text x="610" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">/channel-5/manifest/…</text>
