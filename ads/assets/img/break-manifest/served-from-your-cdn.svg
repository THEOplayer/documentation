<svg width="780" height="260" viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Served from your CDN: your CDN forwards the media stream from your origin and the Break Manifest from OptiView Ads, so the player fetches both from your own domain">
  <rect x="0" y="0" width="100%" height="100%" rx="8" fill="#f4f4fb"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4800c4"/>
    </marker>
  </defs>
  <rect x="20" y="40" width="180" height="44" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="110" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4800c4">Origin</text>
  <rect x="20" y="176" width="180" height="44" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="110" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4800c4">OptiView Ads</text>
  <rect x="300" y="98" width="170" height="64" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="385" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4800c4">Your CDN</text>
  <text x="385" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4800c4">example.com</text>
  <rect x="580" y="106" width="180" height="48" rx="7" fill="#6d19ff" stroke="#4800c4" stroke-width="2"/>
  <text x="670" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Player + Ads SDK</text>
  <line x1="200" y1="62" x2="300" y2="112" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="80" text-anchor="middle" transform="rotate(26.57 250 80)" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">media stream</text>
  <line x1="200" y1="198" x2="300" y2="148" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="160" text-anchor="middle" transform="rotate(-26.57 250 160)" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">break manifest</text>
  <line x1="470" y1="130" x2="580" y2="130" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">one domain</text>
</svg>
