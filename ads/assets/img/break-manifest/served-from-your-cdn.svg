<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Served from your CDN: your CDN at example.com forwards the media stream from your origin and the Break Manifest from us.markers.optiview.dolby.com, so the player fetches both from example.com">
