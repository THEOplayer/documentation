<svg width="780" height="240" viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Side-loading: the OptiView Player fetches the Break Manifest from the OptiView Ads API through the Dolby CDN, and fetches the media stream from the origin through the customer CDN">
  <rect x="0" y="0" width="100%" height="100%" rx="8" fill="#f4f4fb"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4800c4"/>
    </marker>
  </defs>
  <rect x="20" y="40" width="180" height="44" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="110" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4800c4">OptiView Ads API</text>
  <rect x="310" y="40" width="140" height="44" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="380" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4800c4">Dolby CDN</text>
  <rect x="20" y="156" width="180" height="44" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="110" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4800c4">Origin</text>
  <rect x="310" y="156" width="140" height="44" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="380" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4800c4">Customer CDN</text>
  <rect x="580" y="96" width="180" height="48" rx="7" fill="#6d19ff" stroke="#4800c4" stroke-width="2"/>
  <text x="670" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">OptiView Player</text>
  <line x1="200" y1="62" x2="310" y2="62" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">break manifest</text>
  <line x1="450" y1="62" x2="580" y2="108" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">break manifest</text>
  <line x1="200" y1="178" x2="310" y2="178" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">media stream</text>
  <line x1="450" y1="178" x2="580" y2="132" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">media stream</text>
</svg>
