<svg width="760" height="260" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Break lifecycle: preparing to cued, ready, or error; cued to ready via punch; ready to signaled when announced to players">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4800c4"/>
    </marker>
  </defs>
  <rect x="60" y="108" width="140" height="42" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="130" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4800c4">PREPARING</text>
  <rect x="390" y="32" width="105" height="42" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="442" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4800c4">CUED</text>
  <rect x="390" y="108" width="105" height="42" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="442" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4800c4">READY</text>
  <rect x="390" y="184" width="105" height="42" rx="7" fill="#cfd0ff" stroke="#4800c4" stroke-width="2"/>
  <text x="442" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4800c4">ERROR</text>
  <rect x="610" y="108" width="125" height="42" rx="7" fill="#6d19ff" stroke="#4800c4" stroke-width="2"/>
  <text x="672" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">SIGNALED</text>
  <line x1="200" y1="119" x2="390" y2="58" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">prepared, no start yet</text>
  <line x1="200" y1="129" x2="390" y2="129" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">prepared, start set</text>
  <line x1="200" y1="140" x2="390" y2="203" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">scheduling window missed</text>
  <line x1="442" y1="74" x2="442" y2="108" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="478" y="96" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">punch</text>
  <line x1="495" y1="129" x2="610" y2="129" stroke="#4800c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="552" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4800c4">announced to players</text>
</svg>
